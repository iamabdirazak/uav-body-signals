[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uavsignals"
version = "1.0.0"
description = "Viewpoint-robust body-signal recognition for commanding UAVs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdirisak Mubarik Muhumed" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.1"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.3", "matplotlib>=3.7"]
demo = ["mediapipe>=0.10.14", "opencv-python>=4.8", "pillow>=10.0"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["uavsignals"]
